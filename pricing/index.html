<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pricing — High Spire</title>
  <meta
    name="description"
    content="View High Spire pricing and start your free trial through secure Stripe Checkout."
  />

  <link rel="preload" href="/assets/SortsMillGoudy-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="/assets/SortsMillGoudy-Italic.ttf" as="font" type="font/ttf" crossorigin>

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <style>
    @font-face {
      font-family: "Sorts Mill Goudy";
      src: url("/assets/SortsMillGoudy-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Sorts Mill Goudy";
      src: url("/assets/SortsMillGoudy-Italic.ttf") format("truetype");
      font-weight: 400;
      font-style: italic;
      font-display: swap;
    }

    :root {
      --text: #0a0a0a;
      --glass: rgba(255,255,255,0.56);
      --border: rgba(0,0,0,0.14);
      --shadow: 0 22px 70px rgba(0,0,0,0.14);
      --padX: 40px;
      --error: #8f1f1f;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    ::selection {
      background: rgba(0,0,0,0.12);
      color: var(--text);
    }

    body {
      margin: 0;
      font-family: "Sorts Mill Goudy", serif;
      color: var(--text);
      background:
        linear-gradient(to bottom,
          rgba(255,255,255,0.94) 0%,
          rgba(255,255,255,0.86) 26%,
          rgba(255,255,255,0.70) 56%,
          rgba(255,255,255,0.42) 100%
        ),
        url("/assets/high-spire-pricing-background.svg") center / cover no-repeat fixed;
      overscroll-behavior: none;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 16px var(--padX);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.82);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }

    .brand img {
      height: 34px;
      width: auto;
      display: block;
    }

    .brand span {
      font-size: 18px;
      letter-spacing: 0.01em;
      opacity: 0.9;
    }

    .navRow {
      display: inline-flex;
      gap: 10px;
      align-items: center;
    }

    .pill {
      appearance: none;
      -webkit-appearance: none;
      font-family: inherit;
      font-size: 16px;
      line-height: 1;
      color: inherit;
      text-decoration: none;
      padding: 10px 12px;
      border-radius: 0;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.92);
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform .08s ease, background .18s ease;
    }

    .pill:hover {
      transform: translateY(-1px);
      background: rgba(255,255,255,0.98);
    }

    main {
      min-height: calc(100vh - 74px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px var(--padX) 50px;
    }

    .panel {
      width: min(720px, 100%);
      text-align: center;
      background: var(--glass);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      border-radius: 0;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 56px 34px 44px;
    }

    h1 {
      margin: 0;
      font-size: 74px;
      line-height: 1;
      letter-spacing: 0.01em;
    }

    .subtitle {
      margin: 12px auto 0;
      font-size: 42px;
      max-width: 18ch;
      line-height: 1.2;
      opacity: 0.84;
    }

    .supporting {
      margin: 14px 0 0;
      font-size: 20px;
      opacity: 0.72;
    }

    .error {
      margin: 10px 0 0;
      min-height: 1.2em;
      font-size: 16px;
      color: var(--error);
      visibility: hidden;
    }

    .error.show {
      visibility: visible;
    }

    .ctaRow {
      display: flex;
      justify-content: center;
      margin-top: 30px;
    }

    .btn {
      font-family: inherit;
      font-size: 23px;
      padding: 15px 28px;
      border-radius: 0;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.94);
      color: inherit;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 210px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.10);
      transition: transform .08s ease, background .18s ease, opacity .18s ease;
      cursor: pointer;
    }

    .btn:hover { transform: translateY(-1px); }

    .btn.primary {
      background: rgba(17,17,17,0.96);
      border-color: rgba(17,17,17,0.96);
      color: rgba(255,255,255,0.96);
      box-shadow: 0 14px 34px rgba(0,0,0,0.20);
      min-width: 320px;
    }

    .btn.primary:hover {
      background: rgba(17,17,17,0.88);
    }

    .btn:disabled {
      transform: none;
      opacity: 0.52;
      cursor: not-allowed;
    }

    .btn:focus-visible,
    .pill:focus-visible,
    a:focus-visible {
      outline: 2px solid rgba(0,0,0,0.85);
      outline-offset: 2px;
    }

    @media (max-width: 720px) {
      :root { --padX: 18px; }
      header { padding: 14px var(--padX); }
      .brand span { display: none; }
      h1 { font-size: 52px; }
      .subtitle,
      .supporting,
      .error { font-size: 18px; }
      .panel { padding: 32px 20px 28px; }
      .btn { min-width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/" aria-label="High Spire Home">
      <img src="/assets/logo.png" alt="High Spire">
      <span>High Spire</span>
    </a>

    <div class="navRow">
      <a class="pill" href="/watch">Watch Introduction</a>
      <a class="pill" href="/">Back to home</a>
    </div>
  </header>

  <main>
    <section class="panel" aria-label="Pricing and checkout">
      <h1>3 days free.</h1>
      <p class="subtitle">Then $5/month.</p>
      <p class="supporting">Cancel anytime.</p>
      <p id="checkoutError" class="error" aria-live="polite">Checkout unavailable. Please try again.</p>

      <div class="ctaRow">
        <button id="checkoutBtn" class="btn primary" type="button">Start Free Trial</button>
      </div>
    </section>
  </main>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    (function () {
      var checkoutBtn = document.getElementById('checkoutBtn');
      var checkoutError = document.getElementById('checkoutError');
      var pendingCheckoutAfterLogin = false;
      var checkoutInFlight = false;

      function currentUser() {
        return window.netlifyIdentity && typeof window.netlifyIdentity.currentUser === 'function'
          ? window.netlifyIdentity.currentUser()
          : null;
      }

      function setErrorVisible(show) {
        checkoutError.classList.toggle('show', Boolean(show));
      }

      function setCheckoutBusy(isBusy) {
        checkoutInFlight = isBusy;
        checkoutBtn.disabled = isBusy;
        checkoutBtn.textContent = isBusy ? 'Starting checkout...' : 'Start Free Trial';
      }

      function openIdentity() {
        if (!window.netlifyIdentity || typeof window.netlifyIdentity.open !== 'function') {
          setErrorVisible(true);
          return;
        }

        window.netlifyIdentity.open('signup');
      }

      async function getIdentityToken(user) {
        if (!user || typeof user.jwt !== 'function') {
          return null;
        }

        return user.jwt(true);
      }

      async function startCheckout() {
        if (checkoutInFlight) {
          return;
        }

        var user = currentUser();
        if (!user) {
          pendingCheckoutAfterLogin = true;
          openIdentity();
          return;
        }

        setErrorVisible(false);
        setCheckoutBusy(true);

        try {
          var token = await getIdentityToken(user);
          var response = await fetch('/.netlify/functions/create-checkout-session', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              ...(token ? { Authorization: 'Bearer ' + token } : {}),
            },
            body: JSON.stringify({ trial: true }),
          });

          var payload = await response.json().catch(function () { return {}; });
          if (response.status === 401) {
            pendingCheckoutAfterLogin = true;
            setCheckoutBusy(false);
            openIdentity();
            return;
          }

          if (!response.ok || !payload.url) {
            throw new Error(payload && payload.error ? payload.error : 'Checkout unavailable.');
          }

          window.location.assign(payload.url);
        } catch (_err) {
          setErrorVisible(true);
          setCheckoutBusy(false);
        }
      }

      checkoutBtn.addEventListener('click', startCheckout);

      if (window.netlifyIdentity) {
        window.netlifyIdentity.on('init', function () {});
        window.netlifyIdentity.on('login', function (user) {
          window.netlifyIdentity.close();
          if (pendingCheckoutAfterLogin) {
            pendingCheckoutAfterLogin = false;
            startCheckout();
          }
        });
        window.netlifyIdentity.on('logout', function () { setErrorVisible(false); });
        window.netlifyIdentity.init();
      }
    })();
  </script>
</body>
</html>
